<!DOCTYPE html>
<html lang="da">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kodefolkets Rejsebureau</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Kodefolkets Rejsebureau</h1>
    <p>Her kan du gemme og få et overblik over dine tidligere og fremtidige rejsedestinationer.</p>


    <form>
        <label aria-label="Brugernavn" for="username">Brugernavn:</label>
        <input id="username" type="text" name="username" required>
        <label aria-label="Kodeord" for="password">Kodeord:</label>
        <input type="password" id="password" name="password" required>
        <button aria-label="Log ind" type="submit">Log ind</button>
    </form>

    <form>

        <label aria-label="Destination" for="destination">Destination:</label>
        <input id="destination" type="text" name="destination" required>
        <label aria-label="Rejseperiode fra" for="Fra">Rejseperiode fra:</label>
        <input type="date" id="Fra" name="Fra" required>
        <label aria-label="Rejseperiode til" for="Til">Rejseperiode til:</label>
        <input type="date" id="Til" name="Til" required>

        <button aria-label="Gem" type="submit">Gem</button>


    </form>


    
</body>

</html>
